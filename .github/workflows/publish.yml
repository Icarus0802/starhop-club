name: Test Starhop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - run: npm test
      - name: Verify reproducible offline worker
        run: |
          cp js/worker-bundle.js /tmp/starhop-worker.js
          npm run build
          cmp js/worker-bundle.js /tmp/starhop-worker.js
      - run: python3 scripts/package.py
